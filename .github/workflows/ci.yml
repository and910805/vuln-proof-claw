name: Quality

on:
  pull_request:
    branches:
      - mainer
  push:
    branches:
      - mainer

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web console
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
          package-manager-cache: true

      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test, type check, and build Web console
        working-directory: web
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Verify bundled Web assets are current
        run: git diff --exit-code -- src/vuln_proof_claw/web

      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --disable-pip-version-check --upgrade "pip>=26.1.2"
          python -m pip install --disable-pip-version-check --editable ".[dev]"

      - name: Check bilingual documentation
        run: python scripts/check_bilingual_docs.py

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test with branch coverage
        run: python -m pytest --cov=vuln_proof_claw --cov-report=term-missing --cov-report=xml

      - name: Audit Python dependencies
        run: python -m pip_audit

      - name: Run static security analysis
        run: python -m bandit -r src

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
